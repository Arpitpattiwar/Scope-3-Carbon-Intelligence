services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scope3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scope3pass}
      POSTGRES_DB: ${POSTGRES_DB:-scope3db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-scope3} -d $${POSTGRES_DB:-scope3db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scope3}:${POSTGRES_PASSWORD:-scope3pass}@db:5432/${POSTGRES_DB:-scope3db}
      ML_SERVICE_URL: http://ml-service:8001
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ml-service:
    build: ./ml-service
    ports:
      - "8001:8001"
    env_file:
      - ./ml-service/.env
    volumes:
      - ./ml-service:/app
    command: uvicorn service_app:app --host 0.0.0.0 --port 8001

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
  uploads_data:
