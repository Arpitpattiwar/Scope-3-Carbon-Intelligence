version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: scope3
      POSTGRES_PASSWORD: scope3pass
      POSTGRES_DB: scope3db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scope3 -d scope3db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://scope3:scope3pass@db:5432/scope3db
      SECRET_KEY: change-this-in-production-use-openssl-rand-hex-32

      # ── Email / SMTP ─────────────────────────────────────────────────────────
      # For Gmail: Create an App Password at https://myaccount.google.com/apppasswords
      # Set SMTP_USER to your Gmail address and SMTP_PASSWORD to the 16-char app password
      # Leave SMTP_USER empty to use console mock mode (passwords shown in invite modal)
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: "scope3platform@gmail.com"        # e.g. yourname@gmail.com
      SMTP_PASSWORD: "suay dwqd necp qpij"    # e.g. abcd efgh ijkl mnop (Gmail App Password)

      FRONTEND_URL: http://localhost:3000
      AI_ESTIMATION_ENABLED: "false"  # Phase 2: set to "true" when models are ready

    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
