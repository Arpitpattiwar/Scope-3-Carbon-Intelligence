services:
  - type: web
    name: scope3-backend
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scope3-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-vercel-app.vercel.app
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app
      - key: AI_ESTIMATION_ENABLED
        value: "true"
      - key: ML_SERVICE_HOSTPORT
        fromService:
          type: web
          name: scope3-ml-service
          property: hostport
      - key: FORCE_RESEED
        value: "false"

  - type: web
    name: scope3-ml-service
    runtime: docker
    rootDir: ml-service
    plan: free
    envVars:
      - key: ML_FORECAST_MC_SAMPLES
        value: "20"

databases:
  - name: scope3-db
    databaseName: scope3db
    user: scope3
